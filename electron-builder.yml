appId: com.councilofmembers.app
productName: CouncilOfMembers
directories:
  output: dist
files:
  - src/**/*
  - assets/**/*
  - package.json
extraResources:
  - from: assets/fonts/
    to: fonts/
win:
  target: nsis
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
# Auto-update: installed copies check these GitHub Releases on launch.
# `npm run release` (with GH_TOKEN set) builds and publishes a new one;
# bump "version" in package.json first or no device will see it as newer.
publish:
  provider: github
  owner: sonof-anton
  repo: council-of-members
  releaseType: release
